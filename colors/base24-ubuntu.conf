%hidden base00="#300a24"
%hidden base01="#2e3436"
%hidden base02="#555753"
%hidden base03="#747772"
%hidden base04="#949791"
%hidden base05="#b3b7b0"
%hidden base06="#d3d7cf"
%hidden base07="#eeeeec"
%hidden base08="#cc0000"
%hidden base09="#c4a000"
%hidden base0A="#729fcf"
%hidden base0B="#4e9a06"
%hidden base0C="#06989a"
