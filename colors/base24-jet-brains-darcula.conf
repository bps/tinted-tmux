# Template author: Tinted Theming: (https://github.com/tinted-theming)

# Global base24 color variables
%hidden base00="#202020"
%hidden base01="#000000"
%hidden base02="#555555"
%hidden base03="#6b6b6b"
%hidden base04="#818181"
%hidden base05="#979797"
%hidden base06="#adadad"
%hidden base07="#eeeeee"
%hidden base08="#fa5355"
%hidden base09="#c2c300"
%hidden base0A="#6d9df1"
%hidden base0B="#126e00"
%hidden base0C="#33c2c1"
%hidden base0D="#4581eb"
%hidden base0E="#fa54ff"
%hidden base10="#383838"
%hidden base11="#1c1c1c"
%hidden base12="#fb7172"
%hidden base13="#ffff00"
%hidden base14="#67ff4f"
%hidden base15="#60d3d1"
%hidden base16="#6d9df1"
%hidden base17="#fb82ff"

# default statusbar colors
set-option -g status-style "fg=#818181,bg=#000000"

# default window title colors
set-window-option -g window-status-style "fg=#818181,bg=#000000"

# active window title colors
set-window-option -g window-status-current-style "fg=#ffff00,bg=#000000"

# pane border
set-option -g pane-border-style "fg=#000000"
set-option -g pane-active-border-style "fg=#818181"

# message text
set-option -g message-style "fg=#adadad,bg=#555555"

# pane number display
set-option -g display-panes-active-colour "#818181"
set-option -g display-panes-colour "#000000"

# clock
set-window-option -g clock-mode-colour "#4581eb"

# copy mode highlight
set-window-option -g mode-style "fg=#818181,bg=#555555"

# bell
set-window-option -g window-status-bell-style "fg=#202020,bg=#fa5355"

# style for window titles with activity
set-window-option -g window-status-activity-style "fg=#979797,bg=#000000"

# style for command messages
set-option -g message-command-style "fg=#adadad,bg=#555555"

# Optional active/inactive pane state
if-shell '[ "$TINTED_TMUX_OPTION_ACTIVE" = "1" ]' {
  set-window-option -g window-active-style "fg=#979797,bg=#202020"
  set-window-option -g window-style "fg=#979797,bg=#000000"
}

# Optional statusbar
if-shell '[ "$TINTED_TMUX_OPTION_STATUSBAR" = "1" ]' {
  set-option -g status "on"
  set-option -g status-justify "left"
  set-option -g status-left "#[fg=#979797,bg=#6b6b6b] #S #[fg=#6b6b6b,bg=#000000,nobold,noitalics,nounderscore]"
  set-option -g status-left-length "80"
  set-option -g status-left-style none
  set-option -g status-right "#[fg=#555555,bg=#000000 nobold, nounderscore, noitalics]#[fg=#818181,bg=#555555] %Y-%m-%d  %H:%M #[fg=#979797,bg=#555555,nobold,noitalics,nounderscore]#[fg=#000000,bg=#979797] #h "
  set-option -g status-right-length "80"
  set-option -g status-right-style none
  set-window-option -g window-status-current-format "#[fg=#000000,bg=#6d9df1,nobold,noitalics,nounderscore]#[fg=#555555,bg=#6d9df1] #I #[fg=#555555,bg=#6d9df1,bold] #W#{?window_zoomed_flag,*Z,}} #[fg=#6d9df1,bg=#000000,nobold,noitalics,nounderscore]"
  set-window-option -g window-status-format "#[fg=#000000,bg=#555555,noitalics]#[fg=#adadad,bg=#555555] #I #[fg=#adadad,bg=#555555] #W#{?window_zoomed_flag,*Z,}} #[fg=#555555,bg=#000000,noitalics]"
  set-window-option -g window-status-separator ""
}

